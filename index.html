<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務報告</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070a14; --panel:rgba(11,17,34,.82); --panel2:rgba(8,12,26,.92); --cyan:#00eaff; --pink:#ff2bd6; --acid:#b6ff3a; --amber:#ffd23d; --ink:#d6f3ff; --sub:#6e87a8; --line:rgba(0,234,255,.30); --pinkline:rgba(255,43,214,.45); --danger:#ff3b6b; --mono:'Share Tech Mono','Noto Sans JP',monospace; --disp:'Orbitron','Noto Sans JP',sans-serif; --jp:'Noto Sans JP',sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;color:var(--ink);font-family:var(--jp);line-height:1.6; background: radial-gradient(1200px 600px at 12% -10%,rgba(0,234,255,.12),transparent 60%), radial-gradient(1000px 600px at 115% 115%,rgba(255,43,214,.12),transparent 60%), linear-gradient(rgba(0,234,255,.045) 1px,transparent 1px), linear-gradient(90deg,rgba(0,234,255,.045) 1px,transparent 1px), var(--bg); background-size:auto,auto,34px 34px,34px 34px,auto;background-attachment:fixed;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999; background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.16) 2px 3px); mix-blend-mode:multiply}
  ::selection{background:var(--cyan);color:#04121a}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 130px;position:relative;z-index:1}
  header{position:sticky;top:0;z-index:5;padding:16px 14px 14px; background:linear-gradient(180deg,#0a1224,#070a14);border-bottom:1px solid var(--cyan);box-shadow:0 0 22px rgba(0,234,255,.30)}
  header::before{content:"STUDY ROOM // OPS TERMINAL";display:block; font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--cyan);opacity:.8;margin-bottom:4px}
  header h1{margin:0;font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.04em; color:#eafff8;text-shadow:0 0 8px rgba(0,234,255,.7),2px 0 rgba(255,43,214,.45),-2px 0 rgba(0,234,255,.45)}
  header .date{font-family:var(--mono);font-size:12px;color:var(--sub);margin-top:4px;letter-spacing:.06em}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
  .navbtn{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em; color:var(--pink);text-decoration:none;border:1px solid var(--pinkline);padding:5px 10px;cursor:pointer;text-shadow:0 0 6px rgba(255,43,214,.5);transition:.15s}
  .navbtn:hover{background:rgba(255,43,214,.08);box-shadow:0 0 12px rgba(255,43,214,.5)}
  .card{position:relative;background:var(--panel);border:1px solid var(--line); padding:15px 14px;margin-top:16px;backdrop-filter:blur(2px);box-shadow:0 0 16px rgba(0,234,255,.07)}
  .card::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
  .card::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
  
  .alert-box{margin-top:16px;padding:12px;font-size:14px;border:1px solid var(--pink); background:rgba(255,43,214,.1);color:var(--ink);box-shadow:0 0 16px rgba(255,43,214,.3); animation: alertPulse 2s infinite;}
  @keyframes alertPulse { 0%,100%{box-shadow:0 0 16px rgba(255,43,214,.3)} 50%{box-shadow:0 0 24px rgba(255,43,214,.6)} }
  .alert-btn{display:inline-block;margin-top:8px;background:var(--pink);color:#fff; padding:8px 14px;text-decoration:none;font-weight:bold;font-size:13px;border-radius:4px;}

  .label{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;opacity:.85}
  .row{display:flex;gap:10px}.row>*{flex:1}
  input[type=text],input[type=number],textarea,select{ width:100%;border:1px solid var(--line);border-radius:0;padding:11px;font-size:16px;font-family:var(--jp);background:rgba(4,8,18,.85);color:var(--ink);outline:none;transition:.15s}
  input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,234,255,.45),inset 0 0 8px rgba(0,234,255,.12)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%); background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input[readonly]{color:var(--acid);text-shadow:0 0 8px rgba(182,255,58,.45);font-family:var(--mono);letter-spacing:.06em;}
  
  .seg{display:flex;border:1px solid var(--cyan);overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;color:var(--cyan);padding:12px;font-size:14px;font-weight:700;font-family:var(--disp);letter-spacing:.06em;cursor:pointer;}
  .seg button.on{background:var(--cyan);color:#04121a;box-shadow:0 0 18px rgba(0,234,255,.6),inset 0 0 12px rgba(255,255,255,.3)}
  
  .cat{font-family:var(--mono);font-size:12px;color:var(--cyan);margin:20px 2px 4px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 8px rgba(0,234,255,.5)}
  .cat.bonus{color:var(--amber);text-shadow:0 0 8px rgba(255,210,61,.5)}
  .cat::before{content:" AE  "}
  
  .task{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid rgba(0,234,255,.35);padding:12px;margin-top:8px;}
  .task.req{border-left-color:var(--pink)}
  .task.opt{border-left-color:var(--amber)}
  .task.done{border-color:var(--cyan);border-left-color:var(--acid);background:rgba(0,234,255,.07);box-shadow:0 0 16px rgba(0,234,255,.22)}
  .task.opt.done{border-color:var(--amber);border-left-color:var(--amber);background:rgba(255,210,61,.07);box-shadow:0 0 16px rgba(255,210,61,.22)}
  
  .chk{width:28px;height:28px;flex:0 0 28px;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:17px;color:#04121a;margin-top:1px;cursor:pointer;user-select:none;}
  .chk.on{background:var(--acid);border-color:var(--acid);box-shadow:0 0 16px rgba(182,255,58,.7)}
  .chk.opt.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 16px rgba(255,210,61,.7)}
  
  .tname{font-size:15px;font-weight:500;color:var(--ink)}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--pink);border:1px solid var(--pinkline);padding:1px 7px;margin-left:7px;letter-spacing:.1em;}
  
  .task-manual { margin-top:8px; border:1px dashed var(--line); background:rgba(0,234,255,.05); border-radius:4px; }
  .task-manual summary { cursor:pointer; padding:8px; font-family:var(--jp); font-size:12px; color:var(--cyan); list-style:none; user-select:none; }
  .task-manual summary::-webkit-details-marker { display:none; }
  .task-manual summary::before { content:"▶ "; font-size:10px; }
  .task-manual[open] summary::before { content:"▼ "; }
  .task-manual .manual-content { padding:8px; font-size:13px; color:var(--ink); border-top:1px dashed var(--line); white-space:pre-wrap; }

  .photoarea{margin-top:11px}
  .photobtn{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--cyan);color:var(--cyan);background:rgba(0,234,255,.05);padding:10px 15px;font-size:13px;font-weight:700;font-family:var(--mono);cursor:pointer;}
  .preview{margin-top:9px;position:relative;display:inline-block}
  .preview img{max-width:170px;display:block;border:1px solid var(--cyan);box-shadow:0 0 14px rgba(0,234,255,.35)}
  .preview .x{position:absolute;top:-9px;right:-9px;background:var(--pink);color:#fff;width:26px;height:26px;border:0;font-size:15px;cursor:pointer;}
  
  .footer{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:12px 14px;background:linear-gradient(0deg,#070a14,#0a1224);border-top:1px solid var(--cyan);box-shadow:0 0 22px rgba(0,234,255,.35)}
  .footer .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .count{font-family:var(--mono);font-size:12px;color:var(--sub);flex:0 0 auto;letter-spacing:.06em}
  .count b{color:var(--acid);font-size:18px;text-shadow:0 0 8px rgba(182,255,58,.6)}
  .submit{flex:1;border:0;padding:15px;font-size:15px;font-weight:700;font-family:var(--disp);letter-spacing:.08em;cursor:pointer;color:#04121a;background:linear-gradient(90deg,var(--cyan),#22b6ff);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);box-shadow:0 0 22px rgba(0,234,255,.55)}
  .submit:disabled{opacity:.45;box-shadow:none}
  .toast{position:fixed;left:14px;right:14px;bottom:88px;z-index:10;max-width:612px;margin:0 auto;display:none;padding:12px 14px;font-size:14px;background:var(--panel2);color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 20px rgba(0,234,255,.4)}
  
  .clockbtn{width:100%;border:1px solid var(--acid);background:rgba(182,255,58,.08);color:var(--acid);padding:14px;font-size:15px;font-weight:700;font-family:var(--disp);cursor:pointer;text-shadow:0 0 8px rgba(182,255,58,.4)}
  .clockstat{margin-top:10px;font-family:var(--mono);font-size:13px;padding:9px 11px;border:1px solid var(--line);background:rgba(4,8,18,.7)}
  .clockstat.ontime{color:var(--acid);border-color:rgba(182,255,58,.55);}
  .clockstat.late{color:#ffd0dd;border-color:var(--danger);}

  .queue-box { border: 2px dashed var(--danger); background: rgba(255,59,107,.1); padding: 12px; margin-top: 16px; border-radius: 4px; box-shadow: 0 0 16px rgba(255,59,107,.4); }
  .queue-title { color: var(--danger); font-family: var(--mono); font-weight: bold; font-size: 15px; margin-bottom: 8px; animation: flash 1.5s infinite; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .q-item { display:flex; justify-content:space-between; align-items:center; background: rgba(0,0,0,.5); padding: 10px; border-left: 3px solid var(--danger); margin-bottom: 6px; }
  .q-item.doing { border-left-color: var(--cyan); background: rgba(0,234,255,.1); }
  .q-btn { background: var(--danger); color: #fff; border: 0; padding: 6px 12px; font-family: var(--jp); font-weight: bold; border-radius: 4px; cursor: pointer; }
  .q-btn.done { background: var(--cyan); color: #000; }
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" href="notice.html">📢 お知らせ</a>
    <a class="navbtn" href="quiz.html">📝 小テスト</a>
    <a class="navbtn" href="manual.html">📖 マニュアル</a>
    <a class="navbtn" href="dashboard.html">📊 管理ダッシュボード</a>
    <a class="navbtn" href="visits.html">👨‍🏫 生徒来室状況</a>
  </div>
  <h1>自習室 業務報告</h1>
  <div class="date" id="dateLabel">読み込み中…</div>
</header>
<div class="wrap" id="app"><div class="loading" style="text-align:center;padding:50px;color:var(--cyan);font-family:var(--mono)">LOADING OPS INTERFACE...</div></div>
<div class="footer" id="footer" style="display:none">
  <div class="inner">
    <div class="count"><b id="doneNum">0</b> / <span id="totalNum">0</span> 完了<br><span style="color:var(--amber);font-size:10px" id="bonusNum">🌟 ボーナス 0 pt</span></div>
    <button class="submit" id="submitBtn" onclick="submit()">提出する</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbyhofj70rjZiZwbVjgRz_QMOncAi0s_c-SpE-Rl8F4GhiiP3bgfjFwklHJWVcmXq_BK/exec';
const api = {
  call: function(action, payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: action, payload: payload || {} })
    })
    .then(function(res) { return res.json(); })
    .catch(function(err) { console.error('API Error:', err); throw err; });
  }
};


var ENV_RANGE = { tempMin:23, tempMax:27, humidMin:60, humidMax:80 };
var STATE = { shift:'朝', tasks:[], staff:null, staffList:[], temp:'', humid:'', noticePhoto:null };

window.onload = function(){
  api.call('getInitialData').then(onInit).catch(function(e){showToast("Error: "+e, true)});
};

function onInit(d){
  document.getElementById('dateLabel').textContent = d.today;
  STATE.shift = d.shift; STATE.staff = d.staff; STATE.staffList = d.staffList || []; STATE.tasks = d.tasks.map(prep);
  render();
}

function prep(t){ t.done=false; t.memo=''; t.photo=null; return t; }

function render(){
  var opts = '<option value="">担当者を選択</option>';
  STATE.staffList.forEach(function(s,i){ opts += '<option value="'+i+'"'+(STATE.staff&&STATE.staff.staffId===s.staffId?' selected':'')+'>'+esc(s.name)+'</option>'; });
  
  var html = '';
  html += '<div class="card"><div class="label">担当者</div><div class="row">'
    + '<select id="staffSelect" onchange="onStaff()">'+opts+'</select>'
    + '<input type="text" id="staffId" placeholder="ID自動入力" value="'+esc(STATE.staff?STATE.staff.staffId:'')+'" readonly>'
    + '</div></div><div id="noticeAlertArea"></div>';

  html += '<div class="card"><div class="label">出勤打刻</div><button class="clockbtn" id="clockBtn" onclick="clockInTap()">🟢 業務開始（出勤を記録）</button><div id="clockStat"></div></div>';
  
  html += '<div class="card"><div class="label">担当の部</div><div class="seg">'
    + '<button id="seg-朝" class="'+(STATE.shift==='朝'?'on':'')+'" onclick="setShift(\'朝\')">朝の部</button>'
    + '<button id="seg-夕" class="'+(STATE.shift==='夕'?'on':'')+'" onclick="setShift(\'夕\')">夕の部</button></div></div>';
  
  html += '<div class="card"><div class="label">📢 全体へ引き継ぎ・共有事項を投稿する</div>'
    + '<input type="text" id="stNoticeTitle" placeholder="引き継ぎのタイトル/要件を入力...">'
    + '<textarea id="stNoticeContent" style="margin-top:8px;min-height:50px" placeholder="全員に共有したいトラブル、メモなど"></textarea>'
    + '<div class="photoarea" id="stNoticePhotoArea">'
    + (STATE.noticePhoto ? '<div class="preview"><img src="data:'+STATE.noticePhoto.mime+';base64,'+STATE.noticePhoto.data+'"><button class="x" onclick="removeNoticePhoto()">×</button></div>' : '<label class="photobtn">📷 現場の写真を添付<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onNoticePhoto(event)"></label>')
    + '</div>'
    + '<button class="submit" id="stNoticeBtn" onclick="submitStaffNotice()" style="margin-top:10px;width:100%;padding:10px;font-size:14px;background:linear-gradient(90deg,var(--pink),#ff007f);box-shadow:0 0 14px rgba(255,43,214,.3)">📢 共有事項を投稿（配信）する</button></div>';

  html += '<div id="helpQueueArea"></div>';
  html += '<div id="taskList"></div>';
  html += '<div class="card"><div class="label">生徒の状況（欠席・気になる様子など）</div><textarea id="studentStatus" placeholder="特になければ「特になし」"></textarea></div>';
  html += '<div class="card"><div class="label">特記事項・引き継ぎ</div><textarea id="notes" placeholder="特になければ「特になし」"></textarea></div>';
  
  document.getElementById('app').innerHTML = html;
  document.getElementById('footer').style.display = 'block';
  renderTasks(); refreshClockStat(); loadQueue();
}

function getSelectedStaff(){ var sel = document.getElementById('staffSelect'); return (sel && sel.value !== '') ? STATE.staffList[Number(sel.value)] : null; }

function onStaff(){
  var st = getSelectedStaff(); document.getElementById('staffId').value = st ? st.staffId : ''; refreshClockStat();
  var alertArea = document.getElementById('noticeAlertArea');
  if(!st) { if(alertArea) alertArea.innerHTML = ''; return; }
  if(alertArea) {
    alertArea.innerHTML = '<div style="color:var(--sub);font-size:12px;margin-top:10px;">お知らせを確認中...</div>';
    api.call('getNotices', {staffId: st.staffId}).then(function(notices){
      var unread = notices.filter(function(n){ return !n.isRead; });
      if(unread.length > 0){
        alertArea.innerHTML = '<div class="alert-box"><b>⚠️ NEW NOTICE</b><br>未読の引き継ぎ事項が <b>' + unread.length + '件</b> あります。<br><a href="notice.html" class="alert-btn">📢 お知らせを確認する</a></div>';
      } else { alertArea.innerHTML = ''; }
    }).catch(function(e){alertArea.innerHTML='';});
  }
}

function onNoticePhoto(ev){
  var file = ev.target.files[0]; if(!file) return;
  compress(file, function(base64){ STATE.noticePhoto = { data:base64, mime:'image/jpeg', name:file.name||'notice.jpg' }; render(); });
}
function removeNoticePhoto(){ STATE.noticePhoto = null; render(); }

function submitStaffNotice(){
  var st = getSelectedStaff(); if(!st){ showToast('先に担当者を選択してください', true); return; }
  var title = document.getElementById('stNoticeTitle').value.trim(), content = document.getElementById('stNoticeContent').value.trim();
  if(!title || !content){ showToast('タイトルと内容を入力してください', true); return; }
  var btn = document.getElementById('stNoticeBtn'); btn.disabled = true; btn.textContent = 'TRANSMITTING...';
  api.call('addNotice', { author: st.name, title: title, content: content, photo: STATE.noticePhoto }).then(function(res){
    if(res.ok){ showToast('全体へ共有事項を投稿しました！'); STATE.noticePhoto=null; render(); }
    else { showToast('投稿エラー: ' + res.error, true); btn.disabled = false; btn.textContent = '📢 共有事項を投稿（配信）する'; }
  }).catch(function(err){showToast('通信エラー',true);btn.disabled=false;btn.textContent = '📢 共有事項を投稿（配信）する';});
}

function setShift(s){ if(STATE.shift===s) return; STATE.shift = s; document.getElementById('seg-朝').className = (s==='朝'?'on':''); document.getElementById('seg-夕').className = (s==='夕'?'on':''); api.call('getTasks', {shift: s}).then(function(tasks){ STATE.tasks = tasks.map(prep); renderTasks(); }); refreshClockStat(); }
function refreshClockStat(){ var box = document.getElementById('clockStat'), st = getSelectedStaff(); if(!box) return; if(!st){ box.innerHTML=''; return; } api.call('getAttendanceStatus', {shift: STATE.shift, staffId: st.staffId, staffName: st.name}).then(renderClockStat); }
function renderClockStat(rec){
  var box = document.getElementById('clockStat'), btn = document.getElementById('clockBtn'); if(!box) return;
  if(rec && rec.actual){
    var late = (rec.state === '遅刻'); box.className = 'clockstat ' + (late ? 'late' : 'ontime');
    box.innerHTML = (late ? '⚠️ 遅刻 ' : '✅ 打刻済 ') + esc(rec.actual) + '（定刻 ' + esc(rec.scheduled) + '）' + (late ? '／' + rec.minutesLate + '分遅れ' : '') + (rec.reason ? '<br>理由：' + esc(rec.reason) : '');
    if(btn){ btn.disabled = true; btn.textContent = '✔ 出勤記録済み'; }
  } else { box.className = ''; box.innerHTML = ''; if(btn){ btn.disabled = false; btn.textContent = '🟢 業務開始（出勤を記録）'; } }
}

function clockInTap(){
  var st = getSelectedStaff(); if(!st){ showToast('先に担当者を選択してください', true); return; }
  var btn = document.getElementById('clockBtn'); btn.disabled = true; btn.textContent = '記録中…';
  api.call('clockIn', { shift:STATE.shift, staffId:st.staffId, staffName:st.name, reason:'' }).then(function(res){
    if(!res || !res.ok){ btn.disabled=false; btn.textContent='🟢 業務開始（出勤を記録）'; showToast('打刻に失敗：'+(res&&res.error||''), true); return; }
    if(res.needReason){
      var r = window.prompt('定刻を'+res.minutesLate+'分過ぎています。\n遅刻理由を入力してください（任意）',''); if(r===null) r='（未記入）';
      api.call('clockIn', { shift:STATE.shift, staffId:st.staffId, staffName:st.name, reason:r }).then(function(){ refreshClockStat(); });
    } else { refreshClockStat(); showToast(res.late ? '遅刻として記録しました' : '出勤を記録しました', res.late); }
  }).catch(function(err){ btn.disabled=false; btn.textContent='🟢 業務開始（出勤を記録）'; showToast('打刻エラー：'+err, true); });
}

function renderTasks(){
  var reqTasks = {}, optTasks = {};
  STATE.tasks.forEach(function(t,i){ if(t.type==='opt') { (optTasks[t.category]=optTasks[t.category]||[]).push(i); } else { (reqTasks[t.category]=reqTasks[t.category]||[]).push(i); } });
  
  var html='';
  Object.keys(reqTasks).forEach(function(cat){
    html += '<div class="cat">'+esc(cat)+'</div>';
    reqTasks[cat].forEach(function(i){ html += renderTaskItem(i); });
  });

  if(Object.keys(optTasks).length > 0){
    html += '<div style="margin-top:30px; border-top:2px dashed var(--amber); padding-top:10px;">';
    html += '<div class="cat bonus">🏆 任意ボーナス業務（やるとサンクスポイントUP！）</div>';
    Object.keys(optTasks).forEach(function(cat){
      optTasks[cat].forEach(function(i){ html += renderTaskItem(i); });
    });
    html += '</div>';
  }

  document.getElementById('taskList').innerHTML = html; updateCount();
}

function renderTaskItem(i){
  var t = STATE.tasks[i], isOpt = (t.type === 'opt'), chkCls = t.done ? (isOpt ? 'chk opt on' : 'chk on') : 'chk';
  var html = '<div class="task '+(t.photoReq?' req':'')+(isOpt?' opt':'')+(t.done?' done':'')+'" id="task'+i+'">';
  html += '<div style="display:flex;align-items:flex-start;gap:10px">';
  html += '<div class="'+chkCls+'" onclick="toggle('+i+')">'+(t.done?'✓':'')+'</div>';
  html += '<div style="flex:1"><span class="tname">'+esc(t.name)+'</span>'+(t.photoReq?'<span class="badge">写真必須</span>':'')+'</div></div>';
  
  if(t.manualText) {
    html += '<details class="task-manual"><summary>📘 マニュアル（手順）を確認</summary><div class="manual-content">'+esc(t.manualText)+'</div></details>';
  }
  
  if(t.photoReq){
    html += '<div class="photoarea">';
    if(t.photo) html += '<div class="preview"><img src="data:'+t.photo.mime+';base64,'+t.photo.data+'"><button class="x" onclick="removePhoto('+i+')">×</button></div>';
    else html += '<label class="photobtn">📷 写真を撮る<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event,'+i+')"></label>';
    html += '</div>';
  }
  if(t.envInput){
    html += '<div class="row" style="margin-top:10px"><div><div class="label">温度 ℃</div><input type="number" id="temp" placeholder="25" value="'+esc(STATE.temp)+'" oninput="STATE.temp=this.value;checkEnv()"></div><div><div class="label">湿度 %</div><input type="number" id="humid" placeholder="70" value="'+esc(STATE.humid)+'" oninput="STATE.humid=this.value;checkEnv()"></div></div><div id="envWarn"></div>';
  }
  html += '<div class="memo" style="margin-top:10px"><input type="text" placeholder="メモ（任意）" value="'+esc(t.memo)+'" onchange="STATE.tasks['+i+'].memo=this.value"></div></div>';
  return html;
}

function toggle(i){
  var t = STATE.tasks[i];
  if(!t.done && t.photoReq && !t.photo){ showToast('写真を撮ってから完了にできます', true); return; }
  t.done = !t.done; renderTasks();
}

function onPhoto(ev,i){
  var file = ev.target.files[0]; if(!file) return;
  compress(file, function(base64){ STATE.tasks[i].photo = { data:base64, mime:'image/jpeg', name:file.name||'photo.jpg' }; renderTasks(); });
}
function removePhoto(i){ STATE.tasks[i].photo = null; STATE.tasks[i].done = false; renderTasks(); }

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){ var img = new Image(); img.onload = function(){ var max=1280, w=img.width, h=img.height; if(w>h && w>max){ h=h*max/w; w=max; } else if(h>=w && h>max){ w=w*max/h; h=max; } var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.7).split(',')[1]); }; img.src = e.target.result; }; reader.readAsDataURL(file);
}

function checkEnv(){
  var box = document.getElementById('envWarn'); if(!box) return;
  var t = document.getElementById('temp'), h = document.getElementById('humid'), tv = t && t.value!=='' ? Number(t.value) : null, hv = h && h.value!=='' ? Number(h.value) : null, msgs = [];
  if(tv!==null && (tv<ENV_RANGE.tempMin || tv>ENV_RANGE.tempMax)) msgs.push('温度が適正範囲（'+ENV_RANGE.tempMin+'〜'+ENV_RANGE.tempMax+'℃）外です');
  if(hv!==null && (hv<ENV_RANGE.humidMin || hv>ENV_RANGE.humidMax)) msgs.push('湿度が適正範囲（'+ENV_RANGE.humidMin+'〜'+ENV_RANGE.humidMax+'%）外です');
  if(msgs.length){ box.className='envwarn'; box.innerHTML='⚠️ '+msgs.join('<br>⚠️ ')+'<br><span style="color:var(--sub)">換気・空調で調整し、難しければ特記事項へ記入してください。</span>'; } else { box.className=''; box.innerHTML=''; }
}

function updateCount(){
  var doneReq = 0, totalReq = 0, bonusPt = 0;
  STATE.tasks.forEach(function(t){ if(t.type==='req'){ totalReq++; if(t.done) doneReq++; } else if(t.done && t.type==='opt') { bonusPt++; } });
  document.getElementById('doneNum').textContent = doneReq;
  document.getElementById('totalNum').textContent = totalReq;
  document.getElementById('bonusNum').textContent = "🌟 ボーナス " + bonusPt + " pt";
}

function submit(){
  var sel = document.getElementById('staffSelect'); if(sel.value === ''){ showToast('担当者を選択してください', true); return; }
  var st = STATE.staffList[Number(sel.value)], name = st.name, id = st.staffId;
  if(STATE.tasks.filter(function(t){ return t.done && t.photoReq && !t.photo; }).length){ showToast('写真必須の作業に写真がありません', true); return; }
  var tempEl=document.getElementById('temp'), humidEl=document.getElementById('humid');
  var payload = { shift: STATE.shift, staffId:id, staffName:name, temperature: STATE.temp || (tempEl?tempEl.value:''), humidity: STATE.humid || (humidEl?humidEl.value:''), studentStatus: document.getElementById('studentStatus').value.trim(), notes: document.getElementById('notes').value.trim(), tasks: STATE.tasks.map(function(t){ return { taskId:t.taskId, name:t.name, category:t.category, photoReq:t.photoReq, done:t.done, memo:t.memo, photo: t.photo, type: t.type }; }) };
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='送信中…';
  api.call('submitReport', payload).then(function(res){ if(res && res.ok){ showDone(res.reportId); } else { btn.disabled=false; btn.textContent='提出する'; showToast('送信に失敗しました：'+(res&&res.error||''), true); } }).catch(function(err){ btn.disabled=false; btn.textContent='提出する'; showToast('送信エラー：'+err, true); });
}

function showDone(id){
  document.getElementById('footer').style.display='none'; document.getElementById('app').innerHTML = '<div class="done-screen"><div style="font-size:50px">✅</div><h2>提出しました</h2><p class="muted">受付番号：'+esc(id)+'</p></div>'; window.scrollTo(0,0);
}

var toastTimer;
function showToast(msg, warn){ var t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.className='toast'+(warn?' warn':''); t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.style.display='none'; }, 3200); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadQueue() { api.call('getActiveQueue').then(renderQueue); }
function renderQueue(queue) {
  var area = document.getElementById('helpQueueArea'); if(!area) return;
  if (!queue || queue.length === 0) { area.innerHTML = ''; return; }
  var html = '<div class="queue-box"><div class="queue-title">🚨 INCOMING HELP REQUEST ('+queue.length+')</div>';
  queue.forEach(function(q) {
    var isDoing = (q.status === '対応中');
    html += '<div class="q-item ' + (isDoing ? 'doing' : '') + '">';
    html += '<div><span style="font-family:var(--mono);font-size:11px;color:var(--sub)">'+esc(q.time)+'</span><br><b style="color:var(--ink)">'+esc(q.studentName)+'</b><br><span style="font-size:12px;color:var(--sub)">'+esc(q.topic)+'</span>';
    if (isDoing) html += '<br><span style="font-size:10px;color:var(--cyan)">担当: '+esc(q.staff)+'</span>';
    html += '</div>';
    if (!isDoing) { html += '<button class="q-btn" onclick="updateQueue(\''+q.id+'\', \'対応中\')">対応する</button>'; } else { html += '<button class="q-btn done" onclick="updateQueue(\''+q.id+'\', \'完了\')">完了</button>'; }
    html += '</div>';
  });
  html += '</div>'; area.innerHTML = html;
}
function updateQueue(reqId, status) {
  var st = getSelectedStaff(); if(!st && status === '対応中') { showToast('自分の名前を選択してから対応してください', true); return; }
  var staffName = st ? st.name : ''; api.call('updateQueueStatus', {reqId: reqId, status: status, staffName: staffName}).then(loadQueue);
}
setInterval(loadQueue, 30000); setTimeout(loadQueue, 2000);
</script>
</body>
