<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6eb; --border-strong:#c8cfd9;
    --ink:#1a2230; --ink-2:#46505f; --sub:#8a94a3;
    --primary:#0b6cc1; --primary-soft:#e8f1fb; --primary-strong:#0958a3;
    --success:#16a34a; --success-soft:#ecfdf3;
    --warn:#c2410c; --warn-soft:#fef2ea;
    --danger:#b91c1c; --danger-soft:#fde7e7;
    --amber:#b45309; --amber-soft:#fdf5e6;
    /* 旧変数のエイリアス（JS内のインラインスタイル互換） */
    --cyan:#0b6cc1; --pink:#0b6cc1; --acid:#16a34a;
    --pinkline:#cbd5e1; --line:#e3e6eb; --panel:#ffffff; --panel2:#fafbfc;
    --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;
    --mono:var(--jp); --disp:var(--jp);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:var(--jp);line-height:1.65;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px}
  ::selection{background:#dbe9f8;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 140px;position:relative}
  header{position:sticky;top:0;z-index:5;padding:12px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  header .sub,header .date{font-size:12.5px;color:var(--sub);margin-top:3px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .navbtn{display:inline-block;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .navbtn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px}
  .empty{color:var(--sub);font-size:13px;padding:14px 2px;text-align:center}
  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:10px 11px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,108,193,.15)}
  input[readonly]{background:#f3f5f8;color:var(--ink-2);font-weight:500}
  textarea{min-height:60px;line-height:1.55;resize:vertical;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}

  .alert-box{margin-top:14px;padding:12px 14px;border-radius:8px;border:1px solid #fed7aa;background:#fff7ed;color:var(--ink)}
  .alert-btn{display:inline-block;margin-top:8px;background:var(--primary);color:#fff;padding:8px 14px;text-decoration:none;font-weight:600;font-size:13px;border-radius:6px}
  .alert-btn:hover{background:var(--primary-strong);text-decoration:none}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .seg{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-2);padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s}
  .seg button:hover{background:var(--surface-2)}
  .seg button.on{background:var(--primary);color:#fff}
  .cat{font-size:13px;color:var(--ink-2);font-weight:600;margin:18px 2px 4px}
  .cat.bonus{color:var(--amber)}
  .task{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:12px;margin-top:8px;transition:border-color .12s,background .12s}
  .task.req{border-left-color:var(--primary)}
  .task.opt{border-left-color:var(--amber)}
  .task.done{border-left-color:var(--success);background:var(--success-soft)}
  .task.opt.done{border-left-color:var(--amber);background:var(--amber-soft)}
  .chk{width:26px;height:26px;flex:0 0 26px;border:2px solid var(--border-strong);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:bold;margin-top:1px;cursor:pointer;user-select:none;background:var(--surface);transition:.15s}
  .chk:hover{border-color:var(--primary)}
  .chk.on{background:var(--success);border-color:var(--success)}
  .chk.opt.on{background:var(--amber);border-color:var(--amber)}
  .tname{font-size:15px;font-weight:500;color:var(--ink)}
  .badge{display:inline-block;font-size:11px;color:var(--primary);border:1px solid var(--primary);background:var(--primary-soft);padding:1px 6px;margin-left:6px;border-radius:4px;font-weight:500;vertical-align:1px}
  .task-manual{margin-top:8px;border:1px solid var(--border);background:var(--surface-2);border-radius:6px}
  .task-manual summary{cursor:pointer;padding:8px 10px;font-size:12px;color:var(--primary);list-style:none;user-select:none;font-weight:500}
  .task-manual summary::-webkit-details-marker{display:none}
  .task-manual summary::before{content:"▶ ";font-size:10px}
  .task-manual[open] summary::before{content:"▼ "}
  .task-manual .manual-content{padding:10px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--border);white-space:pre-wrap;line-height:1.65}
  .photoarea{margin-top:10px}
  .photobtn{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--border-strong);color:var(--ink-2);background:var(--surface-2);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;transition:.12s}
  .photobtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
  .preview{margin-top:9px;position:relative;display:inline-block}
  .preview img{max-width:170px;display:block;border:1px solid var(--border);border-radius:6px}
  .preview .x{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;width:24px;height:24px;border:0;font-size:14px;cursor:pointer;border-radius:50%;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .footer{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(15,23,42,.05)}
  .footer .inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .count{font-size:12.5px;color:var(--sub);flex:0 0 auto;line-height:1.4}
  .count b{color:var(--success);font-size:18px;font-weight:700}
  .submit{flex:1;border:0;padding:13px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--primary);border-radius:8px;transition:.12s;font-family:inherit}
  .submit:hover:not(:disabled){background:var(--primary-strong)}
  .submit:disabled{background:var(--border-strong);cursor:not-allowed}
  .toast{position:fixed;left:16px;right:16px;bottom:80px;z-index:10;max-width:648px;margin:0 auto;display:none;padding:11px 14px;font-size:14px;background:var(--ink);color:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .toast.warn{background:var(--danger)}
  .clockbtn{width:100%;border:1px solid var(--success);background:var(--success-soft);color:var(--success);padding:13px;font-size:15px;font-weight:600;cursor:pointer;border-radius:8px;font-family:inherit;transition:.12s}
  .clockbtn:hover:not(:disabled){background:var(--success);color:#fff}
  .clockbtn:disabled{opacity:.7;cursor:not-allowed;background:var(--surface-2);color:var(--ink-2);border-color:var(--border)}
  .clockstat{margin-top:9px;font-size:13px;padding:9px 11px;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;color:var(--ink-2)}
  .clockstat.ontime{color:var(--success);border-color:var(--success);background:var(--success-soft)}
  .clockstat.late{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
  .queue-box{border:1px solid var(--danger);background:var(--danger-soft);padding:12px;margin-top:14px;border-radius:8px}
  .queue-title{color:var(--danger);font-weight:700;font-size:14px;margin-bottom:8px}
  .q-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);padding:10px;border-left:3px solid var(--danger);border-radius:6px;margin-bottom:6px}
  .q-item.doing{border-left-color:var(--primary);background:var(--primary-soft)}
  .q-btn{background:var(--danger);color:#fff;border:0;padding:7px 12px;font-weight:600;border-radius:6px;cursor:pointer;font-family:inherit;flex-shrink:0}
  .q-btn:hover{filter:brightness(.95)}
  .q-btn.done{background:var(--success)}
  .done-screen{text-align:center;padding:60px 20px}
  .done-screen .big{font-size:50px}
  .done-screen h2{font-size:20px;margin:14px 0 6px;color:var(--ink);font-weight:700}
  .muted{color:var(--sub);font-size:13px}
  .envwarn{margin-top:8px;font-size:13px;color:var(--danger);line-height:1.55;padding:8px 10px;background:var(--danger-soft);border:1px solid var(--danger);border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" id="noticeLink" target="_top">📢 お知らせ</a>
    <a class="navbtn" id="quizLink" target="_top">📝 小テスト</a>
    <a class="navbtn" id="manualLink" target="_top">📖 マニュアル</a>
    <a class="navbtn" id="dashboardLink" target="_top">📊 管理ダッシュボード</a>
    <a class="navbtn" id="visitsLink" target="_top">👨‍🏫 生徒来室状況</a>
  </div>
  <h1>自習室 業務報告</h1>
  <div class="date" id="dateLabel">読み込み中…</div>
</header>
<div class="wrap" id="app"><div class="loading" style="text-align:center;padding:50px;color:var(--cyan);font-family:var(--mono)">LOADING OPS INTERFACE...</div></div>
<div class="footer" id="footer" style="display:none">
  <div class="inner">
    <div class="count"><b id="doneNum">0</b> / <span id="totalNum">0</span> 完了<br><span style="color:var(--amber);font-size:10px" id="bonusNum">ボーナス 0 pt</span></div>
    <button class="submit" id="submitBtn" onclick="submit()">提出する</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var WEBAPP_URL = '<?= webappUrl ?>';
var ENV_RANGE = { tempMin:23, tempMax:27, humidMin:60, humidMax:80 };
var STATE = { shift:'朝', tasks:[], staff:null, staffList:[], temp:'', humid:'', noticePhoto:null };

window.onload = function(){
  var base = WEBAPP_URL || '';
  var setHref = function(id, page){ var el = document.getElementById(id); if (el) el.href = base ? (base + '?page=' + page) : '#'; };
  setHref('noticeLink', 'notice'); setHref('quizLink', 'quiz'); setHref('manualLink', 'manual'); setHref('dashboardLink', 'dashboard'); setHref('visitsLink', 'visits');
  google.script.run
    .withSuccessHandler(onInit)
    .withFailureHandler(function(err){
      document.getElementById('app').innerHTML='<div style="padding:50px 20px;color:#ff6f91;font-family:var(--mono);text-align:center;line-height:1.7"><div style="font-size:30px;margin-bottom:10px">⚠️</div><div>読み込みに失敗しました</div><div style="margin-top:14px;font-size:12px;color:var(--sub);word-break:break-all">'+(err&&err.message||String(err))+'</div><div style="margin-top:18px;font-size:12px;color:var(--sub)">画面を再読み込みしてください</div></div>';
    })
    .getInitialData();
};

function onInit(d){
  document.getElementById('dateLabel').textContent = d.today;
  STATE.shift = d.shift; STATE.staff = d.staff; STATE.staffList = d.staffList || []; STATE.tasks = d.tasks.map(prep);
  render(d);
}

function prep(t){ t.done=false; t.memo=''; t.photo=null; return t; }

function render(){
  var opts = '<option value="">担当者を選択</option>';
  STATE.staffList.forEach(function(s,i){ opts += '<option value="'+i+'"'+(STATE.staff&&STATE.staff.staffId===s.staffId?' selected':'')+'>'+esc(s.name)+'</option>'; });
  
  var html = '';
  html += '<div class="card"><div class="label">担当者</div><div class="row">'
    + '<select id="staffSelect" onchange="onStaff()">'+opts+'</select>'
    + '<input type="text" id="staffId" placeholder="ID自動入力" value="'+esc(STATE.staff?STATE.staff.staffId:'')+'" readonly>'
    + '</div></div><div id="noticeAlertArea"></div>';

  html += '<div class="card"><div class="label">出勤打刻</div><button class="clockbtn" id="clockBtn" onclick="clockInTap()">🟢 業務開始（出勤を記録）</button><div id="clockStat"></div></div>';
  
  html += '<div class="card"><div class="label">担当の部</div><div class="seg">'
    + '<button id="seg-朝" class="'+(STATE.shift==='朝'?'on':'')+'" onclick="setShift(\'朝\')">朝の部</button>'
    + '<button id="seg-夕" class="'+(STATE.shift==='夕'?'on':'')+'" onclick="setShift(\'夕\')">夕の部</button></div></div>';
  
  html += '<div class="card"><div class="label">📢 全体へ引き継ぎ・共有事項を投稿する</div>'
    + '<input type="text" id="stNoticeTitle" placeholder="引き継ぎのタイトル/要件を入力...">'
    + '<textarea id="stNoticeContent" style="margin-top:8px;min-height:50px" placeholder="全員に共有したいトラブル、メモなど"></textarea>'
    + '<div class="photoarea" id="stNoticePhotoArea">'
    + (STATE.noticePhoto ? '<div class="preview"><img src="data:'+STATE.noticePhoto.mime+';base64,'+STATE.noticePhoto.data+'"><button class="x" onclick="removeNoticePhoto()">×</button></div>' : '<label class="photobtn">📷 現場の写真を添付<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onNoticePhoto(event)"></label>')
    + '</div>'
    + '<button class="submit" id="stNoticeBtn" onclick="submitStaffNotice()" style="margin-top:10px;width:100%;padding:10px;font-size:14px">📢 共有事項を投稿（配信）する</button></div>';
// 質問待ちキューのエリア
  html += '<div id="helpQueueArea"></div>';
  html += '<div id="taskList"></div>';
  html += '<div class="card"><div class="label">生徒の状況（欠席・気になる様子など）</div><textarea id="studentStatus" placeholder="特になければ「特になし」"></textarea></div>';
  html += '<div class="card"><div class="label">特記事項・引き継ぎ</div><textarea id="notes" placeholder="特になければ「特になし」"></textarea></div>';
  
  document.getElementById('app').innerHTML = html;
  document.getElementById('footer').style.display = 'block';
  renderTasks(); refreshClockStat();
}

function getSelectedStaff(){ var sel = document.getElementById('staffSelect'); return (sel && sel.value !== '') ? STATE.staffList[Number(sel.value)] : null; }

function onStaff(){
  var st = getSelectedStaff(); document.getElementById('staffId').value = st ? st.staffId : ''; refreshClockStat();
  var alertArea = document.getElementById('noticeAlertArea');
  if(!st) { if(alertArea) alertArea.innerHTML = ''; return; }
  if(alertArea) {
    alertArea.innerHTML = '<div style="color:var(--sub);font-size:12px;margin-top:10px;">お知らせを確認中...</div>';
    google.script.run.withSuccessHandler(function(notices){
      var unread = notices.filter(function(n){ return !n.isRead; });
      if(unread.length > 0){
        alertArea.innerHTML = '<div class="alert-box"><b>⚠️ NEW NOTICE</b><br>未読の引き継ぎ事項が <b>' + unread.length + '件</b> あります。<br><a href="'+(WEBAPP_URL?WEBAPP_URL+'?page=notice':'#')+'" class="alert-btn" target="_top">📢 お知らせを確認する</a></div>';
      } else { alertArea.innerHTML = ''; }
    }).getNotices(st.staffId);
  }
}

function noticePhotoHtml(){
  return STATE.noticePhoto
    ? '<div class="preview"><img src="data:'+STATE.noticePhoto.mime+';base64,'+STATE.noticePhoto.data+'"><button class="x" onclick="removeNoticePhoto()">×</button></div>'
    : '<label class="photobtn">📷 現場の写真を添付<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onNoticePhoto(event)"></label>';
}
function renderNoticePhotoArea(){ var a = document.getElementById('stNoticePhotoArea'); if(a) a.innerHTML = noticePhotoHtml(); }
function onNoticePhoto(ev){
  var file = ev.target.files[0]; if(!file) return;
  compress(file, function(base64){ STATE.noticePhoto = { data:base64, mime:'image/jpeg', name:file.name||'notice.jpg' }; renderNoticePhotoArea(); });
}
function removeNoticePhoto(){ STATE.noticePhoto = null; renderNoticePhotoArea(); }

function submitStaffNotice(){
  var st = getSelectedStaff(); if(!st){ showToast('先に担当者を選択してください', true); return; }
  var title = document.getElementById('stNoticeTitle').value.trim(), content = document.getElementById('stNoticeContent').value.trim();
  if(!title || !content){ showToast('タイトルと内容を入力してください', true); return; }
  var btn = document.getElementById('stNoticeBtn'); btn.disabled = true; btn.textContent = 'TRANSMITTING...';
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ showToast('全体へ共有事項を投稿しました！'); STATE.noticePhoto=null; document.getElementById('stNoticeTitle').value=''; document.getElementById('stNoticeContent').value=''; renderNoticePhotoArea(); btn.disabled=false; btn.textContent='📢 共有事項を投稿（配信）する'; }
    else { showToast('投稿エラー: ' + res.error, true); btn.disabled = false; btn.textContent = '📢 共有事項を投稿（配信）する'; }
  }).addNotice({ author: st.name, title: title, content: content, photo: STATE.noticePhoto });
}

function setShift(s){ if(STATE.shift===s) return; STATE.shift = s; document.getElementById('seg-朝').className = (s==='朝'?'on':''); document.getElementById('seg-夕').className = (s==='夕'?'on':''); google.script.run.withSuccessHandler(function(tasks){ STATE.tasks = tasks.map(prep); renderTasks(); }).getTasks(s); refreshClockStat(); }
function refreshClockStat(){ var box = document.getElementById('clockStat'), st = getSelectedStaff(); if(!box) return; if(!st){ box.innerHTML=''; return; } google.script.run.withSuccessHandler(renderClockStat).getAttendanceStatus(STATE.shift, st.staffId, st.name); }
function renderClockStat(rec){
  var box = document.getElementById('clockStat'), btn = document.getElementById('clockBtn'); if(!box) return;
  if(rec && rec.actual){
    var late = (rec.state === '遅刻'); box.className = 'clockstat ' + (late ? 'late' : 'ontime');
    box.innerHTML = (late ? '⚠️ 遅刻 ' : '✅ 打刻済 ') + esc(rec.actual) + '（定刻 ' + esc(rec.scheduled) + '）' + (late ? '／' + rec.minutesLate + '分遅れ' : '') + (rec.reason ? '<br>理由：' + esc(rec.reason) : '');
    if(btn){ btn.disabled = true; btn.textContent = '✔ 出勤記録済み'; }
  } else { box.className = ''; box.innerHTML = ''; if(btn){ btn.disabled = false; btn.textContent = '🟢 業務開始（出勤を記録）'; } }
}

function clockInTap(){
  var st = getSelectedStaff(); if(!st){ showToast('先に担当者を選択してください', true); return; }
  var btn = document.getElementById('clockBtn'); btn.disabled = true; btn.textContent = '記録中…';
  google.script.run.withSuccessHandler(function(res){
    if(!res || !res.ok){ btn.disabled=false; btn.textContent='🟢 業務開始（出勤を記録）'; showToast('打刻に失敗：'+(res&&res.error||''), true); return; }
    if(res.needReason){
      var r = window.prompt('定刻を'+res.minutesLate+'分過ぎています。\n遅刻理由を入力してください（任意）',''); if(r===null) r='（未記入）';
      google.script.run.withSuccessHandler(function(){ refreshClockStat(); }).clockIn({ shift:STATE.shift, staffId:st.staffId, staffName:st.name, reason:r });
    } else { refreshClockStat(); showToast(res.late ? '遅刻として記録しました' : '出勤を記録しました', res.late); }
  }).withFailureHandler(function(err){ btn.disabled=false; btn.textContent='🟢 業務開始（出勤を記録）'; showToast('打刻エラー：'+err, true); }).clockIn({ shift:STATE.shift, staffId:st.staffId, staffName:st.name, reason:'' });
}

function renderTasks(){
  var reqTasks = {}, optTasks = {};
  STATE.tasks.forEach(function(t,i){ if(t.type==='opt') { (optTasks[t.category]=optTasks[t.category]||[]).push(i); } else { (reqTasks[t.category]=reqTasks[t.category]||[]).push(i); } });
  
  var html='';
  Object.keys(reqTasks).forEach(function(cat){
    html += '<div class="cat">'+esc(cat)+'</div>';
    reqTasks[cat].forEach(function(i){ html += renderTaskItem(i); });
  });

  if(Object.keys(optTasks).length > 0){
    html += '<div style="margin-top:30px; border-top:2px dashed var(--amber); padding-top:10px;">';
    html += '<div class="cat bonus">任意業務（余力があれば実施。完了分は評価に加点されます）</div>';
    Object.keys(optTasks).forEach(function(cat){
      optTasks[cat].forEach(function(i){ html += renderTaskItem(i); });
    });
    html += '</div>';
  }

  document.getElementById('taskList').innerHTML = html; updateCount();
}

function renderTaskItem(i){
  var t = STATE.tasks[i], isOpt = (t.type === 'opt'), chkCls = t.done ? (isOpt ? 'chk opt on' : 'chk on') : 'chk';
  var html = '<div class="task '+(t.photoReq?' req':'')+(isOpt?' opt':'')+(t.done?' done':'')+'" id="task'+i+'">';
  html += '<div style="display:flex;align-items:flex-start;gap:10px">';
  html += '<div class="'+chkCls+'" onclick="toggle('+i+')">'+(t.done?'✓':'')+'</div>';
  html += '<div style="flex:1"><span class="tname">'+esc(t.name)+'</span>'+(t.photoReq?'<span class="badge">写真必須</span>':'')+'</div></div>';
  
  if(t.manualText) {
    html += '<details class="task-manual"><summary>📘 マニュアル（手順）を確認</summary><div class="manual-content">'+esc(t.manualText)+'</div></details>';
  }
  
  if(t.photoReq){
    html += '<div class="photoarea">';
    if(t.photo) html += '<div class="preview"><img src="data:'+t.photo.mime+';base64,'+t.photo.data+'"><button class="x" onclick="removePhoto('+i+')">×</button></div>';
    else html += '<label class="photobtn">📷 写真を撮る<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event,'+i+')"></label>';
    html += '</div>';
  }
  if(t.envInput){
    html += '<div class="row" style="margin-top:10px"><div><div class="label">温度 ℃</div><input type="number" id="temp" placeholder="25" value="'+esc(STATE.temp)+'" oninput="STATE.temp=this.value;checkEnv()"></div><div><div class="label">湿度 %</div><input type="number" id="humid" placeholder="70" value="'+esc(STATE.humid)+'" oninput="STATE.humid=this.value;checkEnv()"></div></div><div id="envWarn"></div>';
  }
  html += '<div class="memo" style="margin-top:10px"><input type="text" placeholder="メモ（任意）" value="'+esc(t.memo)+'" onchange="STATE.tasks['+i+'].memo=this.value"></div></div>';
  return html;
}

function toggle(i){
  var t = STATE.tasks[i];
  if(!t.done && t.photoReq && !t.photo){ showToast('写真を撮ってから完了にできます', true); return; }
  t.done = !t.done; renderTasks();
}

function onPhoto(ev,i){
  var file = ev.target.files[0]; if(!file) return;
  compress(file, function(base64){ STATE.tasks[i].photo = { data:base64, mime:'image/jpeg', name:file.name||'photo.jpg' }; renderTasks(); });
}
function removePhoto(i){ STATE.tasks[i].photo = null; STATE.tasks[i].done = false; renderTasks(); }

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){ var img = new Image(); img.onload = function(){ var max=1280, w=img.width, h=img.height; if(w>h && w>max){ h=h*max/w; w=max; } else if(h>=w && h>max){ w=w*max/h; h=max; } var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.7).split(',')[1]); }; img.src = e.target.result; }; reader.readAsDataURL(file);
}

function checkEnv(){
  var box = document.getElementById('envWarn'); if(!box) return;
  var t = document.getElementById('temp'), h = document.getElementById('humid'), tv = t && t.value!=='' ? Number(t.value) : null, hv = h && h.value!=='' ? Number(h.value) : null, msgs = [];
  if(tv!==null && (tv<ENV_RANGE.tempMin || tv>ENV_RANGE.tempMax)) msgs.push('温度が適正範囲（'+ENV_RANGE.tempMin+'〜'+ENV_RANGE.tempMax+'℃）外です');
  if(hv!==null && (hv<ENV_RANGE.humidMin || hv>ENV_RANGE.humidMax)) msgs.push('湿度が適正範囲（'+ENV_RANGE.humidMin+'〜'+ENV_RANGE.humidMax+'%）外です');
  if(msgs.length){ box.className='envwarn'; box.innerHTML='⚠️ '+msgs.join('<br>⚠️ ')+'<br><span style="color:var(--sub)">換気・空調で調整し、難しければ特記事項へ記入してください。</span>'; } else { box.className=''; box.innerHTML=''; }
}

function updateCount(){
  var doneReq = 0, totalReq = 0, bonusPt = 0;
  STATE.tasks.forEach(function(t){ if(t.type==='req'){ totalReq++; if(t.done) doneReq++; } else if(t.done && t.type==='opt') { bonusPt++; } });
  document.getElementById('doneNum').textContent = doneReq;
  document.getElementById('totalNum').textContent = totalReq;
  document.getElementById('bonusNum').textContent = "ボーナス " + bonusPt + " pt";
}

function submit(){
  var sel = document.getElementById('staffSelect'); if(sel.value === ''){ showToast('担当者を選択してください', true); return; }
  var st = STATE.staffList[Number(sel.value)], name = st.name, id = st.staffId;
  if(STATE.tasks.filter(function(t){ return t.done && t.photoReq && !t.photo; }).length){ showToast('写真必須の作業に写真がありません', true); return; }
  var tempEl=document.getElementById('temp'), humidEl=document.getElementById('humid');
  var payload = { shift: STATE.shift, staffId:id, staffName:name, temperature: STATE.temp || (tempEl?tempEl.value:''), humidity: STATE.humid || (humidEl?humidEl.value:''), studentStatus: document.getElementById('studentStatus').value.trim(), notes: document.getElementById('notes').value.trim(), tasks: STATE.tasks.map(function(t){ return { taskId:t.taskId, name:t.name, category:t.category, photoReq:t.photoReq, done:t.done, memo:t.memo, photo: t.photo, type: t.type }; }) };
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='送信中…';
  google.script.run.withSuccessHandler(function(res){ if(res && res.ok){ showDone(res.reportId); } else { btn.disabled=false; btn.textContent='提出する'; showToast('送信に失敗しました：'+(res&&res.error||''), true); } }).withFailureHandler(function(err){ btn.disabled=false; btn.textContent='提出する'; showToast('送信エラー：'+err, true); }).submitReport(payload);
}

function showDone(id){
  document.getElementById('footer').style.display='none'; document.getElementById('app').innerHTML = '<div class="done-screen"><div class="big">✅</div><h2>提出しました</h2><p class="muted">受付番号：'+esc(id)+'</p></div>'; window.scrollTo(0,0);
}

var toastTimer;
function showToast(msg, warn){ var t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.className='toast'+(warn?' warn':''); t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.style.display='none'; }, 3200); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// --- 質問待ちキュー監視ロジック ---
function loadQueue() {
  google.script.run.withSuccessHandler(renderQueue).getActiveQueue();
}

function renderQueue(queue) {
  var area = document.getElementById('helpQueueArea');
  if(!area) return;
  
  if (!queue || queue.length === 0) {
    area.innerHTML = '';
    return;
  }
  
  var html = '<div class="queue-box"><div class="queue-title">🚨 INCOMING HELP REQUEST ('+queue.length+')</div>';
  
  queue.forEach(function(q) {
    var isDoing = (q.status === '対応中');
    html += '<div class="q-item ' + (isDoing ? 'doing' : '') + '">';
    html += '<div><span style="font-family:var(--mono);font-size:11px;color:var(--sub)">'+esc(q.time)+'</span><br>';
    html += '<b style="color:var(--ink)">'+esc(q.studentName)+'</b><br>';
    html += '<span style="font-size:12px;color:var(--sub)">'+esc(q.topic)+'</span>';
    if (isDoing) html += '<br><span style="font-size:10px;color:var(--cyan)">担当: '+esc(q.staff)+'</span>';
    html += '</div>';
    
    if (!isDoing) {
      html += '<button class="q-btn" onclick="updateQueue(\''+q.id+'\', \'対応中\')">対応する</button>';
    } else {
      html += '<button class="q-btn done" onclick="updateQueue(\''+q.id+'\', \'完了\')">完了</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

function updateQueue(reqId, status) {
  var st = getSelectedStaff();
  if(!st && status === '対応中') {
    showToast('自分の名前(担当者)を選択してから対応してください', true);
    return;
  }
  var staffName = st ? st.name : '';
  google.script.run.withSuccessHandler(loadQueue).updateQueueStatus(reqId, status, staffName);
}

// 30秒ごとに自動更新してキューをチェック
setInterval(loadQueue, 30000);
// 初回読み込み時にも実行
setTimeout(loadQueue, 2000);
</script>
