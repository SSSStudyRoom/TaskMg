<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6eb; --border-strong:#c8cfd9;
    --ink:#1a2230; --ink-2:#46505f; --sub:#8a94a3;
    --primary:#0b6cc1; --primary-soft:#e8f1fb; --primary-strong:#0958a3;
    --success:#16a34a; --success-soft:#ecfdf3;
    --warn:#c2410c; --warn-soft:#fef2ea;
    --danger:#b91c1c; --danger-soft:#fde7e7;
    --amber:#b45309; --amber-soft:#fdf5e6;
    /* 旧変数のエイリアス（JS内のインラインスタイル互換） */
    --cyan:#0b6cc1; --pink:#0b6cc1; --acid:#16a34a;
    --pinkline:#cbd5e1; --line:#e3e6eb; --panel:#ffffff; --panel2:#fafbfc;
    --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;
    --mono:var(--jp); --disp:var(--jp);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:var(--jp);line-height:1.65;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px}
  ::selection{background:#dbe9f8;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 140px;position:relative}
  header{position:sticky;top:0;z-index:5;padding:12px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  header .sub,header .date{font-size:12.5px;color:var(--sub);margin-top:3px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .navbtn{display:inline-block;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .navbtn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px}
  .empty{color:var(--sub);font-size:13px;padding:14px 2px;text-align:center}
  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:10px 11px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,108,193,.15)}
  input[readonly]{background:#f3f5f8;color:var(--ink-2);font-weight:500}
  textarea{min-height:60px;line-height:1.55;resize:vertical;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}

  body{padding:20px 16px;background:var(--bg)}
  .wrap{max-width:500px;margin:0 auto;padding:0}
  .header-title{text-align:center;font-size:22px;color:var(--ink);font-weight:700;margin-bottom:4px;letter-spacing:.01em}
  .header-sub{text-align:center;font-size:14px;color:var(--sub);margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--border);padding:20px;border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .label{font-size:12.5px;color:var(--sub);font-weight:500;margin-bottom:6px;margin-top:14px;display:block}
  .btn{display:block;width:100%;margin-top:26px;background:var(--primary);color:#fff;border:0;padding:14px;font-size:16px;font-weight:600;cursor:pointer;border-radius:8px;font-family:inherit;transition:.12s}
  .btn:hover:not(:disabled){background:var(--primary-strong)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:var(--border-strong);cursor:not-allowed}
  .done-msg{display:none;text-align:center;padding:36px 10px}
  .done-msg h2{color:var(--success);font-weight:700;margin:0 0 8px}
  .done-msg p{color:var(--ink-2);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="header-title">HELP REQUEST</div>
  <div class="header-sub">質問・対応リクエスト</div>
  
  <div class="card" id="formArea">
    <label class="label">STUDENT ID & NAME / お名前 (必須)</label>
    <select id="sStudent" disabled>
      <option value="">▼ データを読み込み中...</option>
    </select>
    
    <label class="label">TOPIC / 質問の科目・内容 (必須)</label>
    <input type="text" id="sTopic" placeholder="例: 数学の〇〇ページ、勉強計画について 等">
    
    <button class="btn" id="submitBtn" onclick="sendHelp()">🚨 リクエストを送信</button>
  </div>
  
  <div class="card done-msg" id="doneArea">
    <h2>✅ 受付完了</h2>
    <p style="color:var(--sub)">スタッフに通知されました。<br>自席でお待ちください。<br>順番に対応いたします。</p>
    <button class="btn" style="background:var(--cyan);color:#000;margin-top:20px;" onclick="location.reload()">◀ 戻る</button>
  </div>
</div>

<script>
window.onload = function() {
  // 生徒リストの取得
  google.script.run.withSuccessHandler(function(res){
    var sel = document.getElementById('sStudent');
    if(res.ok) {
      sel.innerHTML = '<option value="">▼ 自分の名前(ID)を選択してください</option>';
      res.students.forEach(function(s) {
        // IDと名前を合体させて表示
        sel.innerHTML += '<option value="'+s.id+'" data-name="'+s.name+'">ID: '+s.id+' - '+s.name+'</option>';
      });
      sel.disabled = false;
    } else {
      sel.innerHTML = '<option value="">リスト取得エラー</option>';
      alert(res.error);
    }
  }).withFailureHandler(function(err){
    var sel = document.getElementById('sStudent');
    sel.innerHTML = '<option value="">通信エラー</option>';
    alert('生徒リストの読み込みに失敗しました：'+(err&&err.message||String(err)));
  }).getStudentList();
};

function sendHelp(){
  var sel = document.getElementById('sStudent');
  var topic = document.getElementById('sTopic').value.trim();
  
  if(sel.value === ''){ alert('お名前を選択してください。'); return; }
  if(!topic){ alert('質問の科目・内容を入力してください。'); return; }
  
  // 選択されたoptionからIDと名前を取り出す
  var studentId = sel.value;
  var studentName = sel.options[sel.selectedIndex].getAttribute('data-name');
  
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'TRANSMITTING...';
  
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('doneArea').style.display = 'block';
    } else {
      alert('エラー: ' + res.error);
      btn.disabled = false; btn.textContent = '🚨 リクエストを送信';
    }
  }).withFailureHandler(function(err){
    alert('通信エラー：'+(err&&err.message||String(err)));
    btn.disabled = false; btn.textContent = '🚨 リクエストを送信';
  }).addHelpRequest({ studentId: studentId, studentName: studentName, topic: topic });
}
</script>

</body>
</html>
