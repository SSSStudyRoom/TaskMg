<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6eb; --border-strong:#c8cfd9;
    --ink:#1a2230; --ink-2:#46505f; --sub:#8a94a3;
    --primary:#0b6cc1; --primary-soft:#e8f1fb; --primary-strong:#0958a3;
    --success:#16a34a; --success-soft:#ecfdf3;
    --warn:#c2410c; --warn-soft:#fef2ea;
    --danger:#b91c1c; --danger-soft:#fde7e7;
    --amber:#b45309; --amber-soft:#fdf5e6;
    /* 旧変数のエイリアス（JS内のインラインスタイル互換） */
    --cyan:#0b6cc1; --pink:#0b6cc1; --acid:#16a34a;
    --pinkline:#cbd5e1; --line:#e3e6eb; --panel:#ffffff; --panel2:#fafbfc;
    --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;
    --mono:var(--jp); --disp:var(--jp);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:var(--jp);line-height:1.65;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px}
  ::selection{background:#dbe9f8;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 140px;position:relative}
  header{position:sticky;top:0;z-index:5;padding:12px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  header .sub,header .date{font-size:12.5px;color:var(--sub);margin-top:3px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .navbtn{display:inline-block;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .navbtn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px}
  .empty{color:var(--sub);font-size:13px;padding:14px 2px;text-align:center}
  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:10px 11px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,108,193,.15)}
  input[readonly]{background:#f3f5f8;color:var(--ink-2);font-weight:500}
  textarea{min-height:60px;line-height:1.55;resize:vertical;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}

  .notice-item{background:var(--surface);border:1px solid var(--border);padding:14px;margin-top:12px;border-left:3px solid var(--border);border-radius:8px}
  .notice-item.unread{border-left-color:var(--primary);background:var(--primary-soft)}
  .notice-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
  .n-title{font-size:16px;font-weight:600;color:var(--ink)}
  .n-meta{font-size:11.5px;color:var(--sub);text-align:right;line-height:1.5}
  .n-body{font-size:14px;white-space:pre-wrap;color:var(--ink-2);padding:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;line-height:1.65}
  .n-image{margin-top:10px;text-align:center}
  .n-image img{max-width:100%;border:1px solid var(--border);border-radius:6px}
  .badge-unread{display:inline-block;background:var(--primary);color:#fff;font-size:10.5px;padding:2px 7px;margin-bottom:6px;border-radius:99px;font-weight:600;letter-spacing:.04em}
  .badge-read{display:inline-block;border:1px solid var(--success);color:var(--success);font-size:10.5px;padding:1px 6px;margin-bottom:6px;border-radius:99px;font-weight:600;letter-spacing:.04em;background:var(--success-soft)}
  .btn-read{display:inline-block;margin-top:10px;width:100%;background:var(--primary);color:#fff;border:0;padding:10px;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;font-family:inherit;transition:.12s}
  .btn-read:hover:not(:disabled){background:var(--primary-strong)}
  .btn-read:disabled{background:var(--border-strong);cursor:not-allowed}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" id="formLink" target="_top">🏠 業務報告</a>
    <a class="navbtn" id="quizLink" target="_top">📝 小テスト</a>
    <a class="navbtn" id="dashLink" target="_top">📊 ダッシュボード</a>
  </div>
  <h1>引き継ぎ・共有事項</h1>
</header>
<div class="wrap" id="app"><div style="text-align:center;padding:50px;color:var(--cyan);font-family:var(--mono)">読み込み中…</div></div>
<script>
var WEBAPP_URL = '<?= webappUrl ?>';
var STAFF_LIST = []; var CURRENT_STAFF = null;
window.onload = function(){
  var base = WEBAPP_URL || '';
  var setHref = function(id, page){ var el = document.getElementById(id); if (el) el.href = base ? (base + '?page=' + page) : '#'; };
  setHref('formLink', ''); setHref('quizLink', 'quiz'); setHref('dashLink', 'dashboard');
  google.script.run
    .withSuccessHandler(function(res){ STAFF_LIST = res.staffList; renderSelector(); })
    .withFailureHandler(function(err){ document.getElementById('app').innerHTML='<div style="padding:50px 20px;color:#ff6f91;text-align:center"><div style="font-size:30px">⚠️</div>読み込みに失敗しました<br><span style="font-size:11px;color:var(--sub)">'+(err&&err.message||String(err))+'</span></div>'; })
    .getInitialData();
};
function renderSelector(){
  var opts = '<option value="">▼ あなたの名前を選択してください</option>';
  STAFF_LIST.forEach(function(s, i){ opts += '<option value="'+i+'">'+esc(s.name)+'</option>'; });
  document.getElementById('app').innerHTML = '<div class="card"><div style="font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:6px">SELECT STAFF ID</div><select id="staffSelect" onchange="onStaffSelected()">'+opts+'</select></div><div id="noticeList" style="margin-top:20px"></div>';
}
function onStaffSelected(){
  var sel = document.getElementById('staffSelect'), listArea = document.getElementById('noticeList');
  if(sel.value === ''){ listArea.innerHTML = ''; CURRENT_STAFF = null; return; }
  CURRENT_STAFF = STAFF_LIST[Number(sel.value)]; listArea.innerHTML = '<div style="text-align:center;color:var(--cyan);padding:30px;font-family:var(--mono)">CHECKING NOTICES...</div>';
  google.script.run.withSuccessHandler(renderNotices).getNotices(CURRENT_STAFF.staffId);
}
function renderNotices(notices){
  var listArea = document.getElementById('noticeList');
  if(!notices || notices.length === 0){ listArea.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub);">現在表示できる共有事項はありません。</div>'; return; }
  var html = '';
  notices.forEach(function(n){
    html += '<div class="'+(n.isRead?'notice-item':'notice-item unread')+'" id="notice-'+n.id+'">'
      + (n.isRead ? '<span class="badge-read">確認済</span>' : '<span class="badge-unread">未読</span>')
      + '<div class="notice-header"><div class="n-title">'+esc(n.title)+'</div><div class="n-meta">'+esc(n.date)+'<br>'+esc(n.author)+'</div></div>'
      + '<div class="n-body">'+esc(n.content)+'</div>';
    if(n.imageUrl) html += '<div class="n-image"><a href="'+esc(n.imageUrl)+'" target="_blank"><img src="'+esc(n.imageUrl)+'"></a></div>';
    if(!n.isRead) html += '<button class="btn-read" id="btn-'+n.id+'" onclick="markRead(\''+n.id+'\')">内容を了解しました（確認済みにする）</button>';
    html += '</div>';
  }); listArea.innerHTML = html;
}
function markRead(noticeId){
  if(!CURRENT_STAFF) return; var btn = document.getElementById('btn-'+noticeId); btn.disabled = true; btn.textContent = '処理中...';
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ var item = document.getElementById('notice-'+noticeId); item.className = 'notice-item'; btn.style.display = 'none'; item.querySelector('.badge-unread').outerHTML = '<span class="badge-read">確認済</span>'; }
    else { alert('エラー: ' + res.error); btn.disabled = false; btn.textContent = '内容を了解しました'; }
  }).markNoticeRead(noticeId, CURRENT_STAFF.staffId);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>

</body>
</html>
