<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6eb; --border-strong:#c8cfd9;
    --ink:#1a2230; --ink-2:#46505f; --sub:#8a94a3;
    --primary:#0b6cc1; --primary-soft:#e8f1fb; --primary-strong:#0958a3;
    --success:#16a34a; --success-soft:#ecfdf3;
    --warn:#c2410c; --warn-soft:#fef2ea;
    --danger:#b91c1c; --danger-soft:#fde7e7;
    --amber:#b45309; --amber-soft:#fdf5e6;
    /* 旧変数のエイリアス（JS内のインラインスタイル互換） */
    --cyan:#0b6cc1; --pink:#0b6cc1; --acid:#16a34a;
    --pinkline:#cbd5e1; --line:#e3e6eb; --panel:#ffffff; --panel2:#fafbfc;
    --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;
    --mono:var(--jp); --disp:var(--jp);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:var(--jp);line-height:1.65;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px}
  ::selection{background:#dbe9f8;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 140px;position:relative}
  header{position:sticky;top:0;z-index:5;padding:12px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  header .sub,header .date{font-size:12.5px;color:var(--sub);margin-top:3px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .navbtn{display:inline-block;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .navbtn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px}
  .empty{color:var(--sub);font-size:13px;padding:14px 2px;text-align:center}
  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:10px 11px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,108,193,.15)}
  input[readonly]{background:#f3f5f8;color:var(--ink-2);font-weight:500}
  textarea{min-height:60px;line-height:1.55;resize:vertical;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}

  h3{font-size:13px;margin:22px 2px 4px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
  .row{display:flex;gap:10px;align-items:center;padding:11px;margin-top:8px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px}
  .row.live{border-left-color:var(--success);background:var(--success-soft)}
  .row.left{border-left-color:var(--border-strong);opacity:.85}
  .grow{flex:1;min-width:0}
  .nm{font-size:16px;font-weight:500;color:var(--ink)}
  .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
  .highlight{color:var(--primary);font-weight:600}
  .strategy-btn{display:inline-block;font-weight:600;color:#fff;background:var(--primary);padding:8px 12px;text-decoration:none;font-size:12px;white-space:nowrap;border-radius:6px;flex-shrink:0;transition:.12s}
  .strategy-btn:hover{background:var(--primary-strong);text-decoration:none}
  .strategy-btn.disabled{background:var(--border-strong);color:#fff;pointer-events:none}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border:1px solid var(--success);color:var(--success);background:var(--success-soft);border-radius:99px;font-weight:500}
  .live-dot{width:8px;height:8px;background:var(--success);border-radius:50%;display:inline-block;margin-right:2px}
  .refresh{position:fixed;bottom:20px;right:20px;background:var(--primary);color:#fff;width:48px;height:48px;border-radius:50%;border:0;font-size:20px;box-shadow:0 4px 12px rgba(11,108,193,.3);cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:.12s}
  .refresh:hover{background:var(--primary-strong)}
  .updated{font-size:12px;color:var(--sub);text-align:right;margin-top:16px}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" id="formLink" target="_top">🏠 業務報告</a>
    <a class="navbtn" id="noticeLink" target="_top">📢 お知らせ</a>
    <a class="navbtn" id="quizLink" target="_top">📝 小テスト</a>
    <a class="navbtn" id="dashboardLink" target="_top">📊 ダッシュボード</a>
  </div>
  <h1>自習室 来室状況</h1>
  <div class="date" id="date">読み込み中...</div>
</header>
<div class="wrap" id="app"><div style="text-align:center;padding:70px;color:var(--cyan);font-family:var(--mono)">SYSTEM BOOTING...</div></div>
<button class="refresh" onclick="load()">↻</button>
<script>
var WEBAPP_URL = '<?= webappUrl ?>';
if (!WEBAPP_URL || WEBAPP_URL.indexOf('<' + '?') >= 0) { WEBAPP_URL = window.location.href.split('?')[0]; }
(function(){
  var base = WEBAPP_URL || '';
  var setHref = function(id, page){ var el = document.getElementById(id); if (el) el.href = base ? (base + (page ? '?page=' + page : '')) : '#'; };
  setHref('formLink', ''); setHref('noticeLink', 'notice'); setHref('quizLink', 'quiz'); setHref('dashboardLink', 'dashboard');
})();

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function strategyBlock(s){ if (!s) return '<span class="strategy-btn disabled">戦略未設定</span>'; if (s.match(/^https?:\/\//)) { return '<a class="strategy-btn" href="'+esc(s)+'" target="_blank">📋 OPEN STRATEGY</a>'; } return '<span style="font-size:12px;color:var(--sub)">📋 '+esc(s)+'</span>'; }
function studentRow(s, showOut){
  var cls = showOut ? 'row left' : 'row live';
  var timeInfo = showOut ? 'IN '+esc(s.inTime)+' / OUT '+esc(s.outTime) : 'IN <span class="highlight">'+esc(s.inTime)+'</span>';
  return '<div class="'+cls+'"><div class="grow"><div class="nm">'+esc(s.name)+'</div><div class="meta">ID:'+esc(s.id)+' // '+timeInfo+'</div></div>'+strategyBlock(s.strategy)+'</div>';
}
function render(d){
  if (!d || !d.ok) { document.getElementById('app').innerHTML = '<div class="card"><div class="empty">ERROR: ' + esc(d&&d.error||'読み込み失敗') + '</div></div>'; return; }
  document.getElementById('date').textContent = d.today;
  var html = '';
  html += '<h3><span class="live-dot"></span>ONLINE NOW <span class="badge">'+d.stillIn.length+'</span></h3><div class="card">';
  html += d.stillIn.length === 0 ? '<div class="empty">現在、在室中の生徒はいません</div>' : d.stillIn.map(function(s){ return studentRow(s, false); }).join('');
  html += '</div><h3>LOGGED OUT <span class="badge" style="color:var(--sub);border-color:var(--sub);background:none">'+d.leftAlready.length+'</span></h3><div class="card">';
  html += d.leftAlready.length === 0 ? '<div class="empty">退室した生徒はまだいません</div>' : d.leftAlready.map(function(s){ return studentRow(s, true); }).join('');
  html += '</div><div class="updated">LAST UPDATE: '+esc(d.now)+' (AUTO SYNC EVERY 1 MIN)</div>';
  document.getElementById('app').innerHTML = html;
}
function load(){ 
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(err){ document.getElementById('app').innerHTML='<div class="card"><div class="empty" style="color:#ff6f91">読み込みに失敗しました<br><span style="font-size:11px">'+(err&&err.message||String(err))+'</span></div></div>'; })
    .getStudentsToday();
}
load(); setInterval(load, 60000);
</script>

</body>
</html>
