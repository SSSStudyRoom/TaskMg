<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務報告の承認</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070a14; --panel:rgba(11,17,34,.82); --panel2:rgba(8,12,26,.92); --cyan:#00eaff; --pink:#ff2bd6; --acid:#b6ff3a; --amber:#ffd23d; --ink:#d6f3ff; --sub:#6e87a8; --line:rgba(0,234,255,.30); --pinkline:rgba(255,43,214,.45); --danger:#ff3b6b; --mono:'Share Tech Mono','Noto Sans JP',monospace; --disp:'Orbitron','Noto Sans JP',sans-serif; --jp:'Noto Sans JP',sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;color:var(--ink);font-family:var(--jp);line-height:1.6; background: radial-gradient(1200px 600px at 12% -10%,rgba(0,234,255,.12),transparent 60%), radial-gradient(1000px 600px at 115% 115%,rgba(255,43,214,.12),transparent 60%), linear-gradient(rgba(0,234,255,.045) 1px,transparent 1px), linear-gradient(90deg,rgba(0,234,255,.045) 1px,transparent 1px), var(--bg); background-size:auto,auto,34px 34px,34px 34px,auto;background-attachment:fixed;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999; background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.16) 2px 3px); mix-blend-mode:multiply}
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 130px;position:relative;z-index:1}
  header{position:sticky;top:0;z-index:5;padding:16px 14px 14px; background:linear-gradient(180deg,#0a1224,#070a14); border-bottom:1px solid var(--cyan);box-shadow:0 0 22px rgba(0,234,255,.30)}
  header::before{content:"OPS TERMINAL // APPROVAL";display:block; font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--pink); opacity:.85;margin-bottom:4px;}
  header h1{margin:0;font-family:var(--disp);font-size:19px;font-weight:700; color:#eafff8;text-shadow:0 0 8px rgba(0,234,255,.7)}
  header .sub{font-family:var(--mono);font-size:12px;color:var(--sub);margin-top:4px;letter-spacing:.05em}
  .card{position:relative;background:var(--panel);border:1px solid var(--line); padding:15px 14px;margin-top:16px;backdrop-filter:blur(2px);box-shadow:0 0 16px rgba(0,234,255,.07)}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--ink)}
  .meta div span{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-right:5px;text-transform:uppercase}
  h3{font-family:var(--mono);font-size:12px;margin:20px 2px 4px;color:var(--pink);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 8px rgba(255,43,214,.5)}
  .task{position:relative;background:var(--panel2);border:1px solid var(--line); border-left:3px solid rgba(0,234,255,.35);padding:11px;margin-top:8px; display:flex;gap:10px;align-items:flex-start}
  .mark{font-size:18px;flex:0 0 auto;} .mark.ng{filter:drop-shadow(0 0 6px rgba(255,59,107,.6))}
  .tname{font-size:15px;font-weight:500;color:var(--ink)} .tmemo{font-size:13px;color:var(--sub);}
  .thumb{margin-top:8px} .thumb img{max-width:210px;display:block;border:1px solid var(--cyan);}
  .free{white-space:pre-wrap;font-size:14px;background:rgba(4,8,18,.7); border:1px solid var(--line);padding:11px;margin-top:4px;}
  .footer{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:12px 14px; background:linear-gradient(0deg,#070a14,#0a1224);border-top:1px solid var(--cyan);}
  .footer .inner{max-width:680px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;border:0;padding:15px;font-size:15px;font-weight:700;font-family:var(--disp); cursor:pointer;}
  .approve{background:linear-gradient(90deg,var(--acid),#7fe000);color:#04121a;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
  .reject{background:transparent;color:#ff6f91;border:1px solid var(--danger);}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
  .navbtn{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--cyan);text-decoration:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer;}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" href="index.html">🏠 業務報告</a>
    <a class="navbtn" href="dashboard.html">📊 ダッシュボード</a>
  </div>
  <h1>業務報告の承認</h1><div class="sub" id="subLabel">読み込み中…</div>
</header>
<div class="wrap" id="app"><div style="text-align:center;padding:70px;color:var(--cyan);font-family:var(--mono)">読み込み中…</div></div>
<div class="footer" id="footer" style="display:none"><div class="inner"><button class="btn reject" onclick="decide('reject')">差し戻し</button><button class="btn approve" onclick="decide('approve')">承認する</button></div></div>
<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbyhofj70rjZiZwbVjgRz_QMOncAi0s_c-SpE-Rl8F4GhiiP3bgfjFwklHJWVcmXq_BK/exec';
const api = {
  call: function(action, payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: action, payload: payload || {} })
    })
    .then(function(res) { return res.json(); })
    .catch(function(err) { console.error('API Error:', err); throw err; });
  }
};

var REPORT_ID = new URLSearchParams(window.location.search).get('id') || '';
window.onload = function(){
  if(!REPORT_ID){ document.getElementById('app').innerHTML='<div style="color:red;padding:20px">IDがありません。</div>'; return; }
  api.call('getReport', {reportId: REPORT_ID}).then(render).catch(function(e){ document.getElementById('app').innerHTML='エラー: '+e; });
};
function render(res){
  if(!res || !res.ok){ document.getElementById('app').innerHTML='<div style="padding:20px">'+esc(res&&res.error||'報告が見つかりません')+'</div>'; return; }
  var r = res.report; document.getElementById('subLabel').textContent = r.date+' '+r.shift+'の部 / '+r.staffName;
  var html='<div class="card"><div class="meta">'
    + '<div><span>担当</span>'+esc(r.staffName)+'</div><div><span>提出</span>'+esc(r.time)+'</div>'
    + '<div><span>完了(必須)</span>'+r.doneCount+' / '+r.total+'</div>'
    + '<div style="color:var(--amber);font-weight:bold;text-shadow:0 0 6px rgba(255,210,61,.5)"><span>ボーナス</span>'+(r.bonusPoints||0)+' PT</div>';
  if(r.temperature) html += '<div><span>温湿度</span>'+esc(r.temperature)+'℃ / '+esc(r.humidity)+'%</div>';
  html += '</div></div>';
  html += '<h3>業務チェック</h3>';
  (r.tasks||[]).forEach(function(t){
    html += '<div class="task"><div class="mark'+(t.done?'':' ng')+'">'+(t.done?'✅':'⛔️')+'</div><div style="flex:1"><div class="tname">'+esc(t.name)+'</div>';
    if(t.memo) html += '<div class="tmemo">'+esc(t.memo)+'</div>';
    if(t.photoUrl) html += '<div class="thumb"><a href="'+esc(t.photoUrl)+'" target="_blank"><img src="'+(t.photoUrl)+'"></a></div>';
    html += '</div></div>';
  });
  html += '<h3>生徒の状況</h3><div class="free">'+esc(r.studentStatus||'記載なし')+'</div>';
  html += '<h3>特記事項</h3><div class="free">'+esc(r.notes||'記載なし')+'</div>';
  document.getElementById('app').innerHTML = html;
  if(r.status==='承認待ち' && r.canApprove) document.getElementById('footer').style.display='block';
}
function decide(decision){
  var reason=''; if(decision==='reject'){ reason = prompt('差し戻し理由を入力してください',''); if(reason===null) return; }
  document.querySelectorAll('.btn').forEach(function(b){ b.disabled=true; });
  api.call('decideReport', {reportId: REPORT_ID, decision: decision, reason: reason}).then(function(res){
    if(res && res.ok){ document.getElementById('footer').style.display='none'; document.getElementById('app').innerHTML='<div style="text-align:center;padding:50px"><h2>処理完了</h2><a href="dashboard.html" style="color:var(--cyan)">ダッシュボードへ戻る</a></div>'; }
    else { alert('失敗：'+res.error); document.querySelectorAll('.btn').forEach(function(b){b.disabled=false;}); }
  }).catch(function(e){ alert('エラー:'+e); document.querySelectorAll('.btn').forEach(function(b){b.disabled=false;}); });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
