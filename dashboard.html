<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6eb; --border-strong:#c8cfd9;
    --ink:#1a2230; --ink-2:#46505f; --sub:#8a94a3;
    --primary:#0b6cc1; --primary-soft:#e8f1fb; --primary-strong:#0958a3;
    --success:#16a34a; --success-soft:#ecfdf3;
    --warn:#c2410c; --warn-soft:#fef2ea;
    --danger:#b91c1c; --danger-soft:#fde7e7;
    --amber:#b45309; --amber-soft:#fdf5e6;
    /* 旧変数のエイリアス（JS内のインラインスタイル互換） */
    --cyan:#0b6cc1; --pink:#0b6cc1; --acid:#16a34a;
    --pinkline:#cbd5e1; --line:#e3e6eb; --panel:#ffffff; --panel2:#fafbfc;
    --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;
    --mono:var(--jp); --disp:var(--jp);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:var(--jp);line-height:1.65;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px}
  ::selection{background:#dbe9f8;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 140px;position:relative}
  header{position:sticky;top:0;z-index:5;padding:12px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  header .sub,header .date{font-size:12.5px;color:var(--sub);margin-top:3px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .navbtn{display:inline-block;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .navbtn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .label{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:6px}
  .empty{color:var(--sub);font-size:13px;padding:14px 2px;text-align:center}
  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:10px 11px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,108,193,.15)}
  input[readonly]{background:#f3f5f8;color:var(--ink-2);font-weight:500}
  textarea{min-height:60px;line-height:1.55;resize:vertical;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer}

  .photoarea{margin-bottom:10px;margin-top:6px}
  .photobtn{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--border-strong);color:var(--ink-2);background:var(--surface-2);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;transition:.12s}
  .photobtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
  .preview{position:relative;display:inline-block}
  .preview img{max-width:170px;display:block;border:1px solid var(--border);border-radius:6px}
  .preview .x{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;width:24px;height:24px;border:0;font-size:14px;cursor:pointer;border-radius:50%;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  h3{font-size:13px;margin:22px 2px 4px;color:var(--ink-2);font-weight:600}
  .row{display:flex;gap:10px;align-items:center;padding:11px;margin-top:8px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px}
  .row.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .row.ok{border-left-color:var(--success);background:var(--success-soft)}
  .pill{font-size:11.5px;padding:2px 8px;border:1px solid var(--border-strong);color:var(--ink-2);background:var(--surface);border-radius:99px;white-space:nowrap;font-weight:500}
  .pill.late{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
  .pill.ontime{color:var(--success);border-color:var(--success);background:var(--success-soft)}
  .grow{flex:1;min-width:0}
  .nm{font-size:15px;color:var(--ink);font-weight:500}
  .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
  .openbtn{font-weight:600;color:#fff;background:var(--success);padding:8px 13px;text-decoration:none;font-size:12.5px;white-space:nowrap;border-radius:6px;transition:.12s}
  .openbtn:hover{background:#138a3f;text-decoration:none}
  .submit-btn{font-weight:600;color:#fff;background:var(--primary);padding:11px;border:0;width:100%;font-size:14px;cursor:pointer;border-radius:8px;font-family:inherit;transition:.12s;margin-top:6px}
  .submit-btn:hover:not(:disabled){background:var(--primary-strong)}
  .submit-btn:disabled{background:var(--border-strong);cursor:not-allowed}
  .statbig{font-size:22px;color:var(--success);font-weight:700;line-height:1.2}
  .loading,.msg{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px}
  .refresh{margin-top:18px;width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);padding:11px;cursor:pointer;border-radius:8px;font-family:inherit;font-size:14px;transition:.12s}
  .refresh:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="navbtn" id="formLink" target="_top">🏠 業務報告</a>
    <a class="navbtn" id="noticeLink" target="_top">📢 お知らせ一覧</a>
    <a class="navbtn" id="quizLink" target="_top">📝 小テスト</a>
    <a class="navbtn" id="visitsLink" target="_top">👨‍🏫 生徒来室状況</a>
  </div>
  <h1>管理ダッシュボード</h1>
  <div class="sub" id="subLabel">読み込み中…</div>
</header>
<div class="wrap" id="app"><div class="loading">LOADING INTERFACE...</div></div>

<script>
var WEBAPP_URL = '<?= webappUrl ?>';
var NOTICE_PHOTO = null;

window.onload = function(){
  var base = WEBAPP_URL || '';
  var setHref = function(id, page){ var el = document.getElementById(id); if (el) el.href = base ? (base + (page ? '?page=' + page : '')) : '#'; };
  setHref('formLink', ''); setHref('noticeLink', 'notice'); setHref('quizLink', 'quiz'); setHref('visitsLink', 'visits');
  load();
};

function load(){
  google.script.run.withSuccessHandler(render).withFailureHandler(function(e){ document.getElementById('app').innerHTML='<div class="msg">エラー：'+e+'</div>'; }).getDashboardData();
}

function render(d){
  if(!d || !d.ok){ document.getElementById('subLabel').textContent=''; document.getElementById('app').innerHTML='<div class="msg">'+esc(d&&d.error||'読み込めませんでした')+'</div>'; return; }
  document.getElementById('subLabel').textContent = d.today;
  var html='';

  html += '<h3>📢 全体へのお知らせ配信</h3>';
  html += '<div class="card"><div class="label">ANNOUNCEMENT TITLE / タイトル</div><input type="text" id="admNoticeTitle" placeholder="スタッフ全員に共有する用件を入力..."><div class="label" style="margin-top:8px;">MESSAGE / 本文</div><textarea id="admNoticeContent" style="min-height:70px;" placeholder="伝達事項、引き継ぎ詳細など..."></textarea>';
  
  html += '<div class="photoarea" id="admNoticePhotoArea">';
  if(NOTICE_PHOTO) html += '<div class="preview"><img src="data:'+NOTICE_PHOTO.mime+';base64,'+NOTICE_PHOTO.data+'"><button class="x" onclick="removeNoticePhoto()">×</button></div>';
  else html += '<label class="photobtn">📷 画像を添付する<input type="file" accept="image/*" style="display:none" onchange="onNoticePhoto(event)"></label>';
  html += '</div>';

  html += '<button class="submit-btn" id="admNoticeBtn" onclick="submitAdminNotice()">📢 お知らせを全体へ配信</button></div>';

  html += '<h3>承認待ち（'+d.pending.length+'件）</h3><div class="card">';
  if(!d.pending.length){ html+='<div class="empty">承認待ちはありません 👍</div>'; } else {
    d.pending.forEach(function(p){
      var url = WEBAPP_URL ? (WEBAPP_URL+'?page=review&id='+encodeURIComponent(p.reportId)) : '#';
      html += '<div class="row warn"><div class="grow"><div class="nm">'+esc(p.staffName||'')+'<span class="meta"> ／ '+esc(p.date)+' '+esc(p.shift)+'の部</span></div><div class="meta">提出 '+esc(p.time)+'　完了 '+p.doneCount+'/'+p.total+'</div></div><a class="openbtn" href="' + url + '" target="_top">承認する</a></div>';
    });
  } html += '</div>';

  html += '<h3>本日の業務報告</h3><div class="card">';
  if(!d.reportsToday.length){ html+='<div class="empty">まだ提出はありません。</div>'; } else {
    d.reportsToday.forEach(function(r){
      var rate = r.total ? Math.round(r.doneCount/r.total*100) : 0, st = r.status==='承認済み'?'ok':(r.status==='差し戻し'?'warn':'');
      html += '<div class="row '+st+'"><div class="grow"><div class="nm">'+esc(r.shift)+'の部　'+esc(r.staffName||'')+'</div><div class="meta">提出 '+esc(r.time)+'　温湿度 '+esc(r.temperature||'-')+'℃/'+esc(r.humidity||'-')+'%</div></div><div style="text-align:right"><div class="statbig">'+rate+'%</div><div class="pill">'+esc(r.status)+'</div></div></div>';
    });
  } html += '</div>';

  html += '<h3>本日の出勤</h3><div class="card">';
  if(!d.attendToday.length){ html+='<div class="empty">出勤打刻はまだありません。</div>'; } else {
    d.attendToday.forEach(function(a){
      var late = (a.state==='遅刻');
      html += '<div class="row '+(late?'warn':'ok')+'"><div class="grow"><div class="nm">'+esc(a.shift)+'の部　'+esc(a.staffName)+'</div>'+(late&&a.reason?'<div class="meta">理由：'+esc(a.reason)+'</div>':'')+'</div><div style="text-align:right"><div class="meta">'+esc(a.actual)+' / 定刻'+esc(a.scheduled)+'</div><div class="pill '+(late?'late':'ontime')+'">'+(late?('遅刻 '+a.minutesLate+'分'):'定刻')+'</div></div></div>';
    });
  } html += '</div>';

  // スタッフ別ボーナス累計（管理者のみ表示。スタッフ画面には出ません）
  var sbs = d.staffBonusStats || { month: [], today: [], monthLabel: '' };
  html += '<h3>スタッフ別 任意業務ポイント　<span style="font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.06em">ADMIN ONLY / '+esc(sbs.monthLabel||'')+'</span></h3><div class="card">';
  if(!sbs.month.length){
    html += '<div class="empty">今月はまだ加点がありません。</div>';
  } else {
    sbs.month.forEach(function(s, i){
      var todayEntry = (sbs.today||[]).filter(function(x){ return x.staffName===s.staffName; })[0];
      var todayPt = todayEntry ? todayEntry.points : 0;
      var rankLabel = '<span style="font-family:var(--mono);font-size:11px;color:var(--sub);margin-right:6px">'+(i+1)+'.</span>';
      html += '<div class="row"><div class="grow"><div class="nm">'+rankLabel+esc(s.staffName)+'</div>'+(todayPt?'<div class="meta">本日 +'+todayPt+' pt</div>':'')+'</div><div style="text-align:right"><div class="statbig" style="color:var(--amber)">'+s.points+' pt</div></div></div>';
    });
  }
  html += '</div>';

  html += '<button class="refresh" onclick="load()">↻ 最新の状態に更新</button>';
  html += '<div class="meta" style="margin-top:10px;text-align:center">閲覧者：'+esc(d.viewer)+'</div>';
  document.getElementById('app').innerHTML = html;
}

function noticePhotoHtml(){
  return NOTICE_PHOTO
    ? '<div class="preview"><img src="data:'+NOTICE_PHOTO.mime+';base64,'+NOTICE_PHOTO.data+'"><button class="x" onclick="removeNoticePhoto()">×</button></div>'
    : '<label class="photobtn">📷 画像を添付する<input type="file" accept="image/*" style="display:none" onchange="onNoticePhoto(event)"></label>';
}
function renderNoticePhotoArea(){ var a = document.getElementById('admNoticePhotoArea'); if(a) a.innerHTML = noticePhotoHtml(); }
function onNoticePhoto(ev){
  var file = ev.target.files[0]; if(!file) return;
  compress(file, function(base64){ NOTICE_PHOTO = { data:base64, mime:'image/jpeg', name:file.name||'notice.jpg' }; renderNoticePhotoArea(); });
}
function removeNoticePhoto(){ NOTICE_PHOTO = null; renderNoticePhotoArea(); }

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){ var img = new Image(); img.onload = function(){ var max=1280, w=img.width, h=img.height; if(w>h && w>max){ h=h*max/w; w=max; } else if(h>=w && h>max){ w=w*max/h; h=max; } var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.7).split(',')[1]); }; img.src = e.target.result; }; reader.readAsDataURL(file);
}

function submitAdminNotice(){
  var title = document.getElementById('admNoticeTitle').value.trim(), content = document.getElementById('admNoticeContent').value.trim();
  if(!title || !content){ alert('タイトルと内容を入力してください。'); return; }
  var btn = document.getElementById('admNoticeBtn'); btn.disabled = true; btn.textContent = 'TRANSMITTING...';
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ alert('全体にお知らせを配信しました！'); NOTICE_PHOTO=null; document.getElementById('admNoticeTitle').value=''; document.getElementById('admNoticeContent').value=''; renderNoticePhotoArea(); btn.disabled=false; btn.textContent='📢 お知らせを全体へ配信'; } else { alert('エラーが発生しました: ' + res.error); btn.disabled = false; btn.textContent = '📢 お知らせを全体へ配信'; }
  }).withFailureHandler(function(err){
    alert('通信エラー：'+(err&&err.message||String(err)));
    btn.disabled = false; btn.textContent = '📢 お知らせを全体へ配信';
  }).addNotice({ author: '管理者', title: title, content: content, photo: NOTICE_PHOTO });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>

</body>
</html>
